<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>🏆 Seizoensvoorspellingen</title>
<script>
  // ALLEEN DEZE REGEL AANPASSEN: de openbare link van de poule, tussen de aanhalingstekens.
  var POULE_LINK = "https://claude.ai/public/artifacts/9ee03586-6f50-4d7e-aae2-a26d9bfa7d23";

  if (POULE_LINK.indexOf("VUL-HIER") === -1) window.location.replace(POULE_LINK);
</script>
<style>
  :root { --bg: #ffffff; --tekst: #1f2937; --zacht: #6b7280; --link: #1d4ed8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111827; --tekst: #f3f4f6; --zacht: #9ca3af; --link: #93c5fd; }
  }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--tekst);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 24px; box-sizing: border-box; text-align: center;
  }
  main { max-width: 32rem; }
  h1 { font-size: 1.5rem; margin: 0 0 0.75rem; }
  p { margin: 0.5rem 0; line-height: 1.5; }
  .zacht { color: var(--zacht); }
  a { color: var(--link); font-weight: 600; }
  a:focus-visible { outline: 3px solid var(--link); outline-offset: 3px; border-radius: 2px; }
</style>
</head>
<body>
<main>
  <h1>🏆 Seizoensvoorspellingen</h1>
  <p id="bericht">Je wordt doorgestuurd naar de poule.</p>
  <p id="terugval" class="zacht">Gebeurt er niets? <a id="link" href="#">Open de poule</a>.</p>
  <noscript><p>Zet JavaScript aan om de poule te openen.</p></noscript>
</main>
<script>
  if (POULE_LINK.indexOf("VUL-HIER") !== -1) {
    document.getElementById("bericht").textContent = "De poule is nog niet online. Probeer het later opnieuw.";
    document.getElementById("terugval").style.display = "none";
  } else {
    document.getElementById("link").href = POULE_LINK;
  }
</script>
</body>
</html>
